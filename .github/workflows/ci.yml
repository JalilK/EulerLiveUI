name: EulerLiveUI CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Swift Package Tests
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test
